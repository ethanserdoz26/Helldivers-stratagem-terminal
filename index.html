<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   minimum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Stratagem Terminal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="terminal">

        <div class="arrows">

            <button type="button"
                    aria-label="Up"
                    onclick="enterArrow('up')">⬆</button>

            <button type="button"
                    aria-label="Left"
                    onclick="enterArrow('left')">⬅</button>

            <button type="button"
                    aria-label="Down"
                    onclick="enterArrow('down')">⬇</button>

            <button type="button"
                    aria-label="Right"
                    onclick="enterArrow('right')">➡</button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
